<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 880 280"><title id="title">From a PHP source tag to published Windows downloads</title><desc id="desc">Flowchart showing a new php/php-src tag, build in php/php-windows-builder, upload via php/web-downloads API, and release on php.net.</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="11" refY="6" viewBox="0 0 12 12"><path fill="rgb(104 88 245)" d="M1,1 L11,6 L1,11 Z"/></marker></defs><rect width="880" height="280" fill="#fff" rx="8"/><rect width="878" height="278" x="1" y="1" fill="none" stroke="#d9dee7" stroke-width="2" rx="7"/><text x="440" y="56" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">From a PHP source tag to published Windows downloads</text><g fill="none" stroke="rgb(104 88 245)" stroke-linecap="round" stroke-width="3" marker-end="url(#arrow)"><line x1="218" x2="252" y1="160" y2="160"/><line x1="422" x2="456" y1="160" y2="160"/><line x1="626" x2="660" y1="160" y2="160"/></g><g font-family="Arial, Helvetica, sans-serif"><g><rect width="168" height="96" x="50" y="112" fill="#f5f3ff" stroke="rgb(104 88 245)" stroke-width="2" rx="8"/><text x="134" y="149" fill="#111827" font-size="16" font-weight="700" text-anchor="middle"><tspan x="134" dy="0">New</tspan> <tspan x="134" dy="21">php/php-src tag</tspan></text><circle cx="134" cy="232" r="11" fill="rgb(104 88 245)"/><text x="134" y="236" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text></g><g><rect width="168" height="96" x="254" y="112" fill="#f5f3ff" stroke="rgb(104 88 245)" stroke-width="2" rx="8"/><text x="338" y="145" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="338" dy="0">Build in</tspan> <tspan x="338" dy="18">php/php-</tspan> <tspan x="338" dy="18">windows-builder</tspan></text><circle cx="338" cy="232" r="11" fill="rgb(104 88 245)"/><text x="338" y="236" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text></g><g><rect width="168" height="96" x="458" y="112" fill="#f5f3ff" stroke="rgb(104 88 245)" stroke-width="2" rx="8"/><text x="542" y="145" fill="#111827" font-size="14" font-weight="700" text-anchor="middle"><tspan x="542" dy="0">Upload via</tspan> <tspan x="542" dy="18">php/web-downloads</tspan> <tspan x="542" dy="18">API</tspan></text><circle cx="542" cy="232" r="11" fill="rgb(104 88 245)"/><text x="542" y="236" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text></g><g><rect width="168" height="96" x="662" y="112" fill="rgb(104 88 245)" stroke="rgb(104 88 245)" stroke-width="2" rx="8"/><text x="746" y="153" fill="#fff" font-size="17" font-weight="700" text-anchor="middle"><tspan x="746" dy="0">Release on</tspan> <tspan x="746" dy="22">php.net</tspan></text><circle cx="746" cy="232" r="11" fill="rgb(104 88 245)"/><text x="746" y="236" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text></g></g></svg>